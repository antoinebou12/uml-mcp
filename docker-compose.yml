version: '3.8'

services:
  uml-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    # The image runs as UID 10001; the dev bind mounts below are owned by your host
    # user, so run as root locally (override with UML_MCP_USER=10001 if you prefer).
    user: "${UML_MCP_USER:-0}"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./output:/app/output
    environment:
      - MCP_OUTPUT_DIR=/app/output
      - USE_LOCAL_KROKI=true
      - KROKI_SERVER=http://kroki:8000
      - MCP_DIAGRAM_FALLBACK=${MCP_DIAGRAM_FALLBACK:-false}
      - FASTMCP_STATELESS_HTTP=true
      - USE_LOCAL_PLANTUML=${USE_LOCAL_PLANTUML:-false}
      - PLANTUML_SERVER=${PLANTUML_SERVER:-http://plantuml-server:8080}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      kroki:
        condition: service_started
      blockdiag:
        condition: service_started
      mermaid:
        condition: service_started
      # Only present under `--profile plantuml`; a plain `docker compose up`
      # starts the same three services it always has.
      plantuml-server:
        condition: service_started
        required: false
    restart: unless-stopped

  kroki:
    image: yuzutech/kroki
    ports:
      - "8001:8000"
    environment:
      - KROKI_BLOCKDIAG_HOST=blockdiag
      - KROKI_MERMAID_HOST=mermaid
      # Used only when the `kroki-extra` profile runs these companions.
      - KROKI_BPMN_HOST=bpmn
      - KROKI_EXCALIDRAW_HOST=excalidraw
    restart: unless-stopped

  mermaid:
    image: yuzutech/kroki-mermaid
    restart: unless-stopped

  blockdiag:
    image: yuzutech/kroki-blockdiag
    restart: unless-stopped

  # Opt-in: `docker compose --profile kroki-extra up -d` adds the BPMN and
  # Excalidraw renderers, so every catalog type renders locally (the real-Kroki
  # tests use this stack: UML_MCP_TEST_KROKI_URL=http://127.0.0.1:8001).
  bpmn:
    image: yuzutech/kroki-bpmn
    profiles:
      - kroki-extra
    restart: unless-stopped

  excalidraw:
    image: yuzutech/kroki-excalidraw
    profiles:
      - kroki-extra
    restart: unless-stopped

  # Opt-in only: `docker compose --profile plantuml up -d`.
  # PlantUML is a *fallback* renderer, so also set MCP_DIAGRAM_FALLBACK=true to
  # let UML-MCP reach for it when Kroki cannot render a PlantUML-family diagram.
  plantuml-server:
    image: plantuml/plantuml-server:jetty-v1.2026.6
    profiles:
      - plantuml
    ports:
      - "8002:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  output:
