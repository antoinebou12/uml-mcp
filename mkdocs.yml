site_name: UML-MCP Documentation
site_url: https://antoinebou12.github.io/uml-mcp/
site_description: UML-MCP — diagram generation via Model Context Protocol (MCP) for AI assistants.
repo_url: https://github.com/antoinebou12/uml-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - toc.follow
    - content.action.edit
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/antoinebou12/uml-mcp
      name: uml-mcp on GitHub

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - User Manual: user-manual.md
  - Getting started:
      - Installation: installation.md
      - Configuration: configuration.md
      - Examples: examples.md
      - Diagram Assistant: diagram-assistant.md
      - Diagram rendering fallback: fallback-mechanism.md
  - Diagram types:
      - UML: diagrams/uml.md
      - TikZ: diagrams/tikz.md
  - Integrations:
      - Claude Desktop: integrations/claude_desktop.md
      - Cursor: integrations/cursor.md
      - Vercel & Smithery: integrations/vercel_smithery.md
  - API:
      - Tools: api/tools.md
  - Testing: testing.md
  - Maintainer: refactor-architecture-plan.md

markdown_extensions:
  - attr_list
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - git-revision-date-localized:
      fallback_to_build_date: true
  - minify:
      minify_html: true
