[build-system]
requires = ["poetry-core>=2.0.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "uml-mcp"
version = "1.3.0"
description = "UML diagram generation server with MCP interface"
readme = "README.md"
license = "MIT"
authors = [{ name = "antoinebou12", email = "antoinebou12@users.noreply.github.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.200.0",
    "uvicorn>=0.52,<0.53",
    "pydantic>=2.3.0,<3",
    "pydantic-core>=2.27.0,<3",
    "rich==15.0.0",
    "httpx>=0.28.0,<0.29",
    "typer==0.27.2",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
    "starlette>=1.6.0,<2.0.0",
    "jinja2>=3.1.2,<4",
    "aiofiles>=25,<26",
    "requests>=2.34.2,<3",
    "click==8.5.0",
    "charset-normalizer==3.5.1",
    "python-dateutil>=2.8.2,<3",
    "graphviz>=0.21,<0.22",
    "pillow>=12.0.0,<13",
    "fastmcp-slim[server]==4.0.0",
    "mcp>=2.0.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/antoinebou12/uml-mcp"

[project.scripts]
uml-mcp = "mcp_core.core.server:main"
mcp-server = "mcp_core.core.server:main"

[tool.poetry]
packages = [
    { include = "mcp_core" },
    { include = "tools" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
addopts = "--cov=mcp_core --cov=tools --cov-report=term --cov-report=html"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.format]
quote-style = "double"

# Optional ML / eval examples are not part of the MCP package surface.
[tool.ty.src]
exclude = ["examples/**"]

# FastMCP / Starlette typing is often stricter than runtime; relax in integration tests.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"

[tool.ty.rules]
redundant-cast = "ignore"

[tool.coverage.run]
source = ["mcp_core", "tools"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[dependency-groups]
dev = [
    "tomli>=2.4.1,<3",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.15",
    "ty>=0.0.69",
    "pytest-asyncio>=1.4.0,<2",
    "mypy>=2.0.0,<3",
    "mkdocs>=1.6.0",
    "mkdocs-material[imaging]>=9.7.6",
    "pymdown-extensions>=11.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocstrings[python]>=0.30.0",
]
