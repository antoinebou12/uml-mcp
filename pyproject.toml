[build-system]
requires = ["poetry-core>=2.0.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "uml-mcp"
version = "1.3.0"
description = "UML diagram generation server with MCP interface"
readme = "README.md"
license = "MIT"
authors = [{ name = "antoinebou12", email = "antoinebou12@users.noreply.github.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.200.0",
    "uvicorn>=0.48,<0.49",
    "pydantic>=2.3.0,<3",
    "pydantic-core>=2.27.0,<3",
    "rich==15.0.0",
    "httpx>=0.28.0,<0.29",
    "typer==0.26.8",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
    "starlette>=1.6.0,<2.0.0",
    "jinja2>=3.1.2,<4",
    "aiofiles>=25,<26",
    "requests>=2.34.2,<3",
    "click==8.4.2",
    "charset-normalizer==3.4.7",
    "python-dateutil>=2.8.2,<3",
    "graphviz>=0.21,<0.22",
    "pillow>=12.0.0,<13",
    "fastmcp[tasks]==4.0.0b1",
    "mcp>=2.0.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/antoinebou12/uml-mcp"

[project.scripts]
uml-mcp = "mcp_core.core.server:main"
mcp-server = "mcp_core.core.server:main"

[tool.poetry]
packages = [
    { include = "mcp_core" },
    { include = "tools" },
]

# Transitive constraints used by uv. These deliberately pin packages that have
# historically moved independently of FastMCP/MCP so CI and Vercel resolve the
# same tested graph even without committing a generated lockfile.
[tool.uv]
override-dependencies = [
    "filelock==3.29.4",
    "librt==0.11.0",
    "mypy==2.1.0",
    "pathspec==1.1.1",
    "pre-commit==4.6.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "pytest-cov==7.1.0",
    "tzdata==2026.2",
    "virtualenv==21.7.3",
    "anyio==4.14.1",
    "attrs>=26,<27",
    "authlib==1.7.2",
    "backrefs==7.0",
    "cachetools==7.1.4",
    "certifi==2026.6.17",
    "coverage==7.14.3",
    "cryptography==49.0.0",
    "opentelemetry-api==1.44.0",
    "packaging==26.2",
    "platformdirs==4.10.0",
    "aiofile==3.11.1",
    "ast-serialize==0.5.0",
    "cyclopts==4.22.5",
    "docstring-parser==0.18.0",
    "graphviz==0.21",
    "gitpython==3.1.50",
    "griffelib==2.1.0",
    "joserfc==1.7.4",
    "jsonschema-path==0.5.0",
    "markdown-it-py==4.2.0",
    "mkdocs-get-deps==0.2.2",
    "identify==2.6.19",
    "idna==3.18",
    "importlib-metadata==9.0.0",
    "pygments==2.20.0",
    "pyjwt==2.13.0",
    "python-discovery==1.4.2",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "rich-rst==2.0.2",
    "requests==2.34.2",
    "selectolax==0.4.10",
    "sse-starlette==3.4.5",
    "uncalled-for==0.3.2",
    "urllib3==2.7.0",
    "uvicorn==0.48.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
addopts = "--cov=mcp_core --cov=tools --cov-report=term --cov-report=html"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.format]
quote-style = "double"

# Optional ML / eval examples are not part of the MCP package surface.
[tool.ty.src]
exclude = ["examples/**"]

# FastMCP / Starlette typing is often stricter than runtime; relax in integration tests.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"

[tool.ty.rules]
redundant-cast = "ignore"

[tool.coverage.run]
source = ["mcp_core", "tools"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[dependency-groups]
dev = [
    "tomli>=2.4.1,<3",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.15",
    "ty>=0.0.69",
    "pytest-asyncio>=1.4.0,<2",
    "mypy>=2.0.0,<3",
    "mkdocs>=1.6.0",
    "mkdocs-material[imaging]>=9.7.6",
    "pymdown-extensions>=11.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocstrings[python]>=0.30.0",
]
