[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "uml-mcp"
version = "1.3.0"
requires-python = ">=3.12,<3.13"

[tool.poetry]
name = "uml-mcp"
version = "1.3.0"
description = "UML diagram generation server with MCP interface"
authors = ["antoinebou12 <antoinebou12@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/antoinebou12/uml-mcp"
packages = [
    { include = "mcp_core" },
    { include = "tools" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.128.0,<0.136.0"
uvicorn = ">=0.45.0,<0.46"
pydantic = "^2.3.0"
pydantic-core = ">=2.27.0,<3"
rich = "==15.0.0"
httpx = "^0.28.0"
typer = "==0.24.2"
python-multipart = ">=0.0.22,<0.1"
python-dotenv = "==1.2.2"
starlette = ">=0.52.0,<1.0.0"
jinja2 = "^3.1.2"
aiofiles = ">=25,<26"
requests = ">=2.33.1,<3"
click = "==8.3.3"
charset-normalizer = "==3.4.7"
python-dateutil = "^2.8.2"
# Add diagram-related dependencies
graphviz = ">=0.21,<0.22"
pillow = "^12.0.0"
# If fastmcp is not your own module but a dependency (2.3.1+ for http_app / Streamable HTTP)
fastmcp = ">=2.3.1,<4"
mcp = ">=1.24.0,<2.0.0"

# Transitive-only pins (direct versions live in [tool.poetry.dependencies] above).
# Revisit when bumping fastmcp / httpx / starlette; drop entries when upstream aligns.
[tool.uv]
override-dependencies = [
    "anyio==4.13.0",
    "attrs>=26,<27",
    "authlib==1.7.0",
    "cachetools==7.0.5",
    "certifi==2026.4.22",
    "cryptography==46.0.7",
    "cyclopts==4.11.0",
    "docstring-parser==0.18.0",
    "graphviz==0.21",
    "idna==3.13",
    "importlib-metadata==9.0.0",
    "pygments==2.20.0",
    "pyjwt==2.12.1",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "sse-starlette==3.3.4",
]

[tool.poetry.group.dev.dependencies]
tomli = "^2.0.0"
pytest = "^7.4.2"
pytest-cov = "^4.1.0"
pre-commit = "^4.0.0"
ruff = ">=0.8.0"
ty = ">=0.0.14"
pytest-asyncio = "^0.21.1"
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
mkdocs-git-revision-date-localized-plugin = ">=1.4.0"
mkdocs-minify-plugin = ">=0.8.0"

[tool.poetry.scripts]
# Official MCP server CLI (single entrypoint; server.py delegates here)
uml-mcp = "mcp_core.core.server:main"
mcp-server = "mcp_core.core.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
addopts = "--cov=mcp_core --cov=tools --cov-report=term --cov-report=html"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.format]
quote-style = "double"

# Optional ML / eval code and one-off scripts are not part of the MCP package surface.
[tool.ty.src]
exclude = ["scripts/**", "examples/**"]

# FastMCP / Starlette typing is often stricter than runtime; relax in integration tests.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"

[tool.ty.rules]
redundant-cast = "ignore"

[tool.coverage.run]
source = ["mcp_core", "tools"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[dependency-groups]
dev = [
    "tomli>=2.0.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.14",
    "pytest-asyncio>=0.21.1",
    "mypy>=1.19.1",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.6",
    "pymdown-extensions>=10.21.2",
    "mkdocs-git-revision-date-localized-plugin>=1.4.0",
    "mkdocs-minify-plugin>=0.8.0",
]
