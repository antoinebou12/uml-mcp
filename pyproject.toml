[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "uml-mcp"
version = "1.3.0"
requires-python = ">=3.12,<3.15"

[tool.poetry]
name = "uml-mcp"
version = "1.3.0"
description = "UML diagram generation server with MCP interface"
authors = ["antoinebou12 <antoinebou12@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/antoinebou12/uml-mcp"
packages = [
    { include = "mcp_core" },
    { include = "tools" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.136.0,<0.200.0"
uvicorn = ">=0.45.0,<0.47"
pydantic = "^2.3.0"
pydantic-core = ">=2.27.0,<3"
rich = "==15.0.0"
httpx = "^0.28.0"
typer = "==0.25.1"
python-multipart = "==0.0.27"
python-dotenv = "==1.2.2"
starlette = ">=1.0.0,<2.0.0"
jinja2 = "^3.1.2"
aiofiles = ">=25,<26"
requests = ">=2.33.1,<3"
click = "==8.3.3"
charset-normalizer = "==3.4.7"
python-dateutil = "^2.8.2"
# Add diagram-related dependencies
graphviz = ">=0.21,<0.22"
pillow = "^12.0.0"
# If fastmcp is not your own module but a dependency (2.3.1+ for http_app / Streamable HTTP)
fastmcp = ">=2.3.1,<4"
mcp = ">=1.24.0,<2.0.0"

# Transitive-only pins (direct versions live in [tool.poetry.dependencies] above).
# Revisit when bumping fastmcp / httpx / starlette; drop entries when upstream aligns.
[tool.uv]
override-dependencies = [
    "filelock==3.29.0",
    "librt==0.9.0",
    "mypy==1.20.2",
    "pathspec==1.1.1",
    "pre-commit==4.6.0",
    "pydantic==2.13.3",
    "pydantic-core==2.46.3",
    "pytest-cov==7.1.0",
    "tzdata==2026.2",
    "virtualenv==21.3.0",
    "anyio==4.13.0",
    "attrs>=26,<27",
    "authlib==1.7.0",
    "backrefs==7.0",
    "cachetools==7.0.6",
    "certifi==2026.4.22",
    "coverage==7.13.5",
    "cryptography>=47,<48",
    "opentelemetry-api==1.41.1",
    "packaging==26.2",
    "platformdirs==4.9.6",
    "cyclopts==4.11.1",
    "docstring-parser==0.18.0",
    "graphviz==0.21",
    "gitpython==3.1.49",
    "jsonschema-path==0.4.6",
    "mkdocs-get-deps==0.2.2",
    "identify==2.6.19",
    "idna==3.13",
    "importlib-metadata==9.0.0",
    "pygments==2.20.0",
    "pyjwt==2.12.1",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "sse-starlette==3.4.1",
    "uvicorn==0.46.0",
]

[tool.poetry.group.dev.dependencies]
tomli = ">=2.4.1,<3"
pytest = ">=9.0.3,<10"
pytest-cov = ">=7.1.0,<8"
pre-commit = "^4.6.0"
ruff = ">=0.15.12"
ty = ">=0.0.34"
pytest-asyncio = "^0.21.1"
mkdocs = ">=1.6.0"
mkdocs-material = { version = ">=9.7.6", extras = ["imaging"] }
mkdocs-git-revision-date-localized-plugin = ">=1.4.0"
mkdocs-minify-plugin = ">=0.8.0"
mkdocs-glightbox = ">=0.4.0"
mkdocstrings = { version = ">=0.30.0", extras = ["python"] }

[tool.poetry.scripts]
# Official MCP server CLI (single entrypoint; server.py delegates here)
uml-mcp = "mcp_core.core.server:main"
mcp-server = "mcp_core.core.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
addopts = "--cov=mcp_core --cov=tools --cov-report=term --cov-report=html"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.format]
quote-style = "double"

# Optional ML / eval examples are not part of the MCP package surface.
[tool.ty.src]
exclude = ["examples/**"]

# FastMCP / Starlette typing is often stricter than runtime; relax in integration tests.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"

[tool.ty.rules]
redundant-cast = "ignore"

[tool.coverage.run]
source = ["mcp_core", "tools"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[dependency-groups]
dev = [
    "tomli>=2.4.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
    "pytest-asyncio>=0.21.1",
    "mypy>=1.20.2",
    "mkdocs>=1.6.0",
    "mkdocs-material[imaging]>=9.7.6",
    "pymdown-extensions>=10.21.2",
    "mkdocs-git-revision-date-localized-plugin>=1.4.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocstrings[python]>=0.30.0",
]
