name: UML-MCP CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mcp_core/**"
      - "tools/**"
      - "api/**"
      - "app.py"
      - "server.py"
      - "tests/**"
      - "smithery.yaml"
      - "vercel.json"
      - "Dockerfile"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/**"
      - ".cursor/mcp.json"
      - "deploy/**"
      - "frontend/**"
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff check and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Lint MCP definitions and config (uml-mcp lint)
        env:
          UML_MCP_CONFIG: none
          USE_REAL_FASTMCP: "1"
        run: uv run uml-mcp lint --strict --min-grade A --min-score 100 --token-budget 5500

      - name: Validate Cursor MCP config
        run: |
          jq -e '
            .mcpServers["uml-mcp"].transport == "http" and
            (.mcpServers["uml-mcp"].url | test("/mcp$")) and
            (.mcpServers["uml-mcp"].url | startswith("https://"))
          ' .cursor/mcp.json

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    # A real Kroki (plus companions) so the agent, smoke and catalog tests check
    # actual renders, not only the in-test fake (tests/fixtures_real.py).
    services:
      kroki:
        image: yuzutech/kroki
        ports: ["8001:8000"]
        env:
          KROKI_MERMAID_HOST: mermaid
          KROKI_BLOCKDIAG_HOST: blockdiag
          KROKI_BPMN_HOST: bpmn
          KROKI_EXCALIDRAW_HOST: excalidraw
      mermaid:
        image: yuzutech/kroki-mermaid
      blockdiag:
        image: yuzutech/kroki-blockdiag
      bpmn:
        image: yuzutech/kroki-bpmn
      excalidraw:
        image: yuzutech/kroki-excalidraw
    env:
      UML_MCP_TEST_KROKI_URL: http://127.0.0.1:8001
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      # Tools some tests need; without them those tests skip (e.g. under `act`,
      # where get.helm.sh and the Playwright CDN may be unreachable).
      - name: Install Helm (chart render tests)
        if: ${{ !env.ACT }}
        uses: azure/setup-helm@v5.0.1

      - name: Install Chromium (Playwright e2e tests)
        if: ${{ !env.ACT }}
        run: uv run playwright install --with-deps chromium

      - name: Wait for Kroki
        run: |
          for i in $(seq 1 60); do
            curl -fsS "$UML_MCP_TEST_KROKI_URL/health" >/dev/null && exit 0
            sleep 2
          done
          echo "Kroki did not become healthy"; exit 1

      - name: Run tests
        run: |
          uv run pytest -m "not public_kroki" --cov=mcp_core --cov=tools --cov-report=term --cov-report=html --cov-fail-under=82 -rs

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Build static MCP server card
        run: uv run python -m mcp_core.build_static_server_card

      - name: Vercel/FastAPI entrypoint smoke test
        env:
          FASTMCP_STATELESS_HTTP: "true"
          MCP_MEMORY_ONLY: "true"
          MCP_URL_ONLY: "true"
          MCP_OUTPUT_DIR: /tmp/diagrams
          VERCEL_OUTPUT_DIR: /tmp/diagrams
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app

          route_paths = {getattr(route, "path", None) for route in app.routes}
          assert "/health" in route_paths, route_paths
          assert "/mcp" in route_paths, route_paths

          with TestClient(app) as client:
              response = client.get("/health")
              assert response.status_code == 200, response.text
              payload = response.json()
              assert payload.get("status") == "healthy", payload

          print("Vercel/FastAPI entrypoint smoke test OK")
          PY

      - name: Upload coverage reports
        if: ${{ !env.ACT }}  # act has no compatible artifact server
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14

  # The same agent / smoke / catalog tests through the public https://kroki.io.
  # A kroki.io outage must not block merges, so this job is informational.
  public-kroki:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Real journeys through kroki.io
        env:
          UML_MCP_TEST_PUBLIC_KROKI: "1"
        run: |
          uv run pytest -m public_kroki --no-cov -rs \
            tests/test_real_journeys.py tests/test_chatgpt_mcp_smoke_prompt.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      - name: Lint and render the chart (none / jwt / entra-proxy)
        run: |
          set -euo pipefail
          chart=deploy/helm/uml-mcp
          for values in "$chart"/ci/*-values.yaml; do
            echo "::group::$values"
            helm lint --strict "$chart" -f "$values"
            helm template ci "$chart" -f "$values" > /dev/null
            echo "::endgroup::"
          done
          # auth enabled without a resource URL must fail closed
          if helm template ci "$chart" -f "$chart/ci/none-values.yaml" --set auth.mode=jwt >/dev/null 2>&1; then
            echo "expected failure without auth.resourceUrl"; exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint, typecheck, unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build and check committed assets are current
        run: |
          npm run build
          git diff --exit-code -- ../mcp_core/admin_ui/dist || {
            echo "::error::mcp_core/admin_ui/dist is stale: run 'cd frontend && npm run build' and commit"; exit 1; }
          test -z "$(git status --porcelain -- ../mcp_core/admin_ui/dist)"

  build:
    uses: ./.github/workflows/build.yml
