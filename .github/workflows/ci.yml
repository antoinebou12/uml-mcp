name: UML-MCP CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mcp_core/**"
      - "tools/**"
      - "app.py"
      - "server.py"
      - "tests/**"
      - "smithery.yaml"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements.txt"
      - ".pre-commit-config.yaml"
      - ".github/workflows/**"
      - ".cursor/mcp.json"
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff check and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate Cursor MCP config
        run: |
          jq -e '
            .mcpServers["uml-mcp"].transport == "http" and
            (.mcpServers["uml-mcp"].url | test("/mcp$")) and
            (.mcpServers["uml-mcp"].url | startswith("https://"))
          ' .cursor/mcp.json

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Assert uv.lock is up-to-date
        run: |
          uv lock --check

      - name: Run tests
        run: |
          uv run pytest --cov=mcp_core --cov=tools --cov-report=term --cov-report=html --cov-fail-under=82

      - name: Build documentation
        run: uv run mkdocs build

      - name: Health check (FastAPI UML API)
        run: |
          uv run python -c "
          import subprocess, time
          import httpx
          p = subprocess.Popen(['uv', 'run', 'uvicorn', 'app:app', '--host', '127.0.0.1', '--port', '8765'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
            time.sleep(3)
            r = httpx.get('http://127.0.0.1:8765/health', timeout=5)
            assert r.status_code == 200, r.status_code
            print('Health check OK')
          finally:
            p.terminate()
            p.wait(timeout=5)
          "

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14

  build:
    uses: ./.github/workflows/build.yml
