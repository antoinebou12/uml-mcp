# Reusable: test Vercel deployment, then publish to Smithery (URL-based).
# Called from cd.yml when deploy_to_smithery is true or on push to main.
# Order: test Vercel (health + server-card + MCP JSON-RPC) -> publish Smithery.

name: Deploy (Vercel test + Smithery publish)

on:
  workflow_call:
    inputs:
      vercel_url:
        description: "Vercel deployment root URL (no trailing slash)"
        required: false
        type: string
        default: "https://uml-mcp.vercel.app"
      skip_smithery:
        description: "Skip Smithery publish (smoke test only)"
        required: false
        type: boolean
        default: false
    secrets:
      SMITHERY_API_KEY:
        description: "Smithery API key for publish (--key)"
        required: false
  workflow_dispatch:
    inputs:
      vercel_url:
        description: "Vercel deployment root URL (no trailing slash)"
        required: false
        type: string
        default: "https://uml-mcp.vercel.app"
      skip_smithery:
        description: "Skip Smithery publish (smoke test only)"
        required: false
        type: boolean
        default: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      VERCEL_URL: ${{ inputs.vercel_url || github.event.inputs.vercel_url || 'https://uml-mcp.vercel.app' }}
    steps:
      # Smithery CLI is the npm package @smithery/cli — there is no PyPI package "smithery-cli".
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test Vercel – health
        run: |
          curl -sf "${VERCEL_URL}/health" | jq -e '.status == "healthy"' || (echo "Health check failed" && exit 1)

      - name: Test Vercel – server card
        run: |
          curl -sf "${VERCEL_URL}/.well-known/mcp/server-card.json" | jq -e '.serverInfo and .tools' || (echo "Server card check failed" && exit 1)

      - name: Test Vercel – MCP tools/list
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          curl -sNL --max-time 30 \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            "${VERCEL_URL}/mcp" >"$raw"
          payload="$(grep '^data: ' "$raw" | head -1 | sed 's/^data: //' || true)"
          if [ -z "$payload" ]; then
            echo "MCP tools/list: no SSE data line"
            head -20 "$raw"
            exit 1
          fi
          if ! echo "$payload" | jq -e '[.result.tools[].name] | contains(["generate_uml"])'; then
            echo "MCP tools/list response:"
            echo "$payload" | jq .
            exit 1
          fi

      - name: Test Vercel – MCP list_diagram_types
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          curl -sNL --max-time 60 \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_diagram_types","arguments":{}}}' \
            "${VERCEL_URL}/mcp" >"$raw"
          payload="$(grep '^data: ' "$raw" | head -1 | sed 's/^data: //' || true)"
          if [ -z "$payload" ]; then
            echo "MCP list_diagram_types: no SSE data line"
            head -20 "$raw"
            exit 1
          fi
          if ! echo "$payload" | jq -e '.result.content | length > 0'; then
            echo "MCP list_diagram_types response:"
            echo "$payload" | jq .
            exit 1
          fi

      - name: Publish to Smithery
        if: ${{ inputs.skip_smithery != true && github.event.inputs.skip_smithery != 'true' && secrets.SMITHERY_API_KEY != '' }}
        run: |
          npx -y @smithery/cli publish \
            --name @antoinebou12/uml \
            --url "${VERCEL_URL}/mcp" \
            --config-schema smithery-config-schema.json \
            --key "${{ secrets.SMITHERY_API_KEY }}"
