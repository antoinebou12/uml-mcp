# Reusable: test Vercel deployment, then publish to Smithery (URL-based).
# Called from cd.yml when deploy_to_smithery is true or on push to main.
# Order: test Vercel (health + server-card + MCP JSON-RPC) -> publish Smithery.

name: Deploy (Vercel test + Smithery publish)

on:
  workflow_call:
    inputs:
      vercel_url:
        description: "Vercel deployment root URL (no trailing slash)"
        required: false
        type: string
        default: "https://uml-mcp.vercel.app"
    secrets:
      SMITHERY_API_KEY:
        description: "Smithery API key for publish (--key)"
        required: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      # Smithery CLI is the npm package @smithery/cli — there is no PyPI package "smithery-cli".
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test Vercel – health
        run: |
          curl -sf "${{ inputs.vercel_url }}/health" | jq -e '.status == "healthy"' || (echo "Health check failed" && exit 1)

      - name: Test Vercel – server card
        run: |
          curl -sf "${{ inputs.vercel_url }}/.well-known/mcp/server-card.json" | jq -e '.serverInfo and .tools' || (echo "Server card check failed" && exit 1)

      - name: Test Vercel – MCP tools/list
        run: |
          curl -sN --max-time 30 \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            "${{ inputs.vercel_url }}/mcp" \
          | grep '^data: ' | head -1 | sed 's/^data: //' \
          | jq -e '.result.tools | map(.name) | index("generate_uml") != null' \
          || (echo "MCP tools/list check failed" && exit 1)

      - name: Test Vercel – MCP list_diagram_types
        run: |
          curl -sN --max-time 60 \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_diagram_types","arguments":{}}}' \
            "${{ inputs.vercel_url }}/mcp" \
          | grep '^data: ' | head -1 | sed 's/^data: //' \
          | jq -e '.result.content' \
          || (echo "MCP list_diagram_types check failed" && exit 1)

      - name: Publish to Smithery
        run: |
          npx -y @smithery/cli publish \
            --name @antoinebou12/uml \
            --url "${{ inputs.vercel_url }}/mcp" \
            --config-schema smithery-config-schema.json \
            --key "${{ secrets.SMITHERY_API_KEY }}"
