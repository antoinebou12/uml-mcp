# Reusable: wait for the Vercel Git deployment, validate MCP 2026, then publish to Smithery.

name: Deploy (Vercel conformance + Smithery publish)

on:
  workflow_call:
    inputs:
      vercel_url:
        description: "Vercel deployment root URL (no trailing slash)"
        required: false
        type: string
        default: "https://uml-mcp.vercel.app"
      skip_smithery:
        description: "Skip Smithery publish (smoke test only)"
        required: false
        type: boolean
        default: false
    secrets:
      SMITHERY_API_KEY:
        description: "Smithery API key for publish (--key)"
        required: false
  workflow_dispatch:
    inputs:
      vercel_url:
        description: "Vercel deployment root URL (no trailing slash)"
        required: false
        type: string
        default: "https://uml-mcp.vercel.app"
      skip_smithery:
        description: "Skip Smithery publish (smoke test only)"
        required: false
        type: boolean
        default: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_URL: ${{ inputs.vercel_url || github.event.inputs.vercel_url || 'https://uml-mcp.vercel.app' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Wait for Vercel deployment
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if payload="$(curl -fsS --max-time 10 "${VERCEL_URL}/health" 2>/dev/null)" \
              && echo "$payload" | jq -e '.status == "healthy"' >/dev/null; then
              echo "Vercel deployment is healthy: ${VERCEL_URL}"
              exit 0
            fi
            echo "Waiting for Vercel deployment (${i}/60)..."
            sleep 5
          done
          echo "Vercel deployment did not become healthy"
          curl -i --max-time 15 "${VERCEL_URL}/health" || true
          exit 1

      - name: Validate MCP server card
        run: |
          curl -fsS --max-time 20 "${VERCEL_URL}/.well-known/mcp/server-card.json" \
            | jq -e '.serverInfo and .tools'

      - name: Check deployed stateless lifecycle
        run: |
          npx -y @modelcontextprotocol/conformance@0.2.0-alpha.9 server \
            --url "${VERCEL_URL}/mcp" \
            --scenario server-stateless \
            --spec-version 2026-07-28 \
            --verbose

      - name: Check deployed cache hints
        run: |
          npx -y @modelcontextprotocol/conformance@0.2.0-alpha.9 server \
            --url "${VERCEL_URL}/mcp" \
            --scenario caching \
            --spec-version 2026-07-28 \
            --verbose

      - name: Check deployed HTTP headers
        run: |
          npx -y @modelcontextprotocol/conformance@0.2.0-alpha.9 server \
            --url "${VERCEL_URL}/mcp" \
            --scenario http-header-validation \
            --spec-version 2026-07-28 \
            --verbose

      - name: Publish to Smithery
        if: ${{ inputs.skip_smithery != true && github.event.inputs.skip_smithery != 'true' }}
        run: |
          npx -y @smithery/cli publish \
            --name @antoinebou12/uml \
            --url "${VERCEL_URL}/mcp" \
            --config-schema smithery-config-schema.json \
            --key "${{ secrets.SMITHERY_API_KEY }}"
