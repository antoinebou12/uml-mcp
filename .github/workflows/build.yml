name: Build Package

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build package
        run: |
          uv build
          ls -la dist/

      - name: Assert wheel layout
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if not wheels:
              print("FAIL: no wheel produced", file=sys.stderr)
              sys.exit(1)

          for whl in wheels:
              with zipfile.ZipFile(whl) as z:
                  tops = {
                      n.split("/")[0]
                      for n in z.namelist()
                      if n and not n.endswith("/")
                  }
              if "mcp_core" not in tops:
                  print(f"FAIL: {whl} must include mcp_core", file=sys.stderr)
                  sys.exit(1)
              if "tools" not in tops:
                  print(f"FAIL: {whl} must include tools", file=sys.stderr)
                  sys.exit(1)
          print("wheel layout OK")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uml-mcp-dist-${{ matrix.python-version }}
          path: dist/
          retention-days: 5
