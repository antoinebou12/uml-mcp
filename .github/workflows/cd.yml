name: UML-MCP CD Pipeline

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version_increment:
        description: 'Version increment type (patch, minor, major)'
        required: true
        default: 'patch'
      vercel_url:
        description: 'Vercel deployment root URL (no trailing slash)'
        required: false
        default: 'https://uml-mcp.vercel.app'
      deploy_to_smithery:
        description: 'Deploy to Smithery after build'
        type: boolean
        required: false
        default: false
      publish_to_pypi:
        description: 'Publish to PyPI after build'
        type: boolean
        required: false
        default: false

jobs:
  # At least one job must have no dependencies (workflow requirement)
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: echo "CD pipeline starting"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true') ||
      github.event_name == 'release'
    uses: ./.github/workflows/publish.yml
    with:
      version_increment: ${{ github.event.inputs.version_increment }}
    secrets: inherit

  deploy:
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_smithery == 'true') ||
      github.event_name == 'release'
    uses: ./.github/workflows/deploy.yml
    with:
      vercel_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.vercel_url || 'https://uml-mcp.vercel.app' }}
    secrets: inherit
