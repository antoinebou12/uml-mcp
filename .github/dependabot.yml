# Dependabot complements Renovate without opening duplicate Python PRs.
# Python dependencies are managed by Renovate from the canonical PEP 621
# pyproject.toml. Dependabot remains responsible for Actions and Docker updates.
# Dependabot security alerts/updates are configured in repository settings.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
