# Continue.dev — use with Ollama (or any Continue model provider)
# Merge the `mcpServers` block into your Continue config (~/.continue/config.yaml).
# Docs: https://docs.continue.dev/

name: UML-MCP (Continue + Ollama)
version: 1.0.0
schema: v1

# Example Ollama model (adjust to what you have pulled locally):
models:
  - name: Local Ollama
    provider: ollama
    model: llama3.2

mcpServers:
  - name: uml-mcp
    type: streamable-http
    url: https://uml-mcp.vercel.app/mcp

