{{- if .Values.plantuml.enabled }}
{{- $c := dict "ctx" . "component" "plantuml" }}
{{- $name := include "uml-mcp.rendererName" $c }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "uml-mcp.labels" . | nindent 4 }}
    {{- include "uml-mcp.rendererSelectorLabels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "uml-mcp.rendererSelectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uml-mcp.rendererSelectorLabels" $c | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: plantuml
          image: "{{ .Values.plantuml.image.repository }}:{{ .Values.plantuml.image.tag }}"
          imagePullPolicy: {{ .Values.plantuml.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          {{- with .Values.plantuml.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.plantuml.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plantuml.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plantuml.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "uml-mcp.labels" . | nindent 4 }}
    {{- include "uml-mcp.rendererSelectorLabels" $c | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - {port: {{ .Values.plantuml.service.port }}, targetPort: http, protocol: TCP, name: http}
  selector:
    {{- include "uml-mcp.rendererSelectorLabels" $c | nindent 4 }}
{{- end }}
