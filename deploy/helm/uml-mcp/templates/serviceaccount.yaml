{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uml-mcp.serviceAccountName" . }}
  labels:
    {{- include "uml-mcp.labels" . | nindent 4 }}
  {{- $ann := deepCopy .Values.serviceAccount.annotations }}
  {{- if .Values.workloadIdentity.enabled }}
  {{- $_ := set $ann "azure.workload.identity/client-id" (default .Values.auth.entra.clientId .Values.workloadIdentity.clientId) }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
