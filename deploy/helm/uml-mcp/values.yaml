# Default values for uml-mcp.
# No container image is published yet: build and push your own
#   docker build -t <registry>/uml-mcp:1.4.0 . && docker push <registry>/uml-mcp:1.4.0
image:
  repository: ""          # REQUIRED, e.g. myregistry.azurecr.io/uml-mcp
  tag: ""                 # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Entra tokens can be large; raise the header buffer on ingress-nginx:
  #   nginx.ingress.kubernetes.io/large-client-header-buffers: "4 32k"
  hosts: []               # e.g. [mcp.contoso.com]
  tls: []                 # e.g. [{secretName: uml-mcp-tls, hosts: [mcp.contoso.com]}]

# Enterprise authentication. mode: none | jwt | entra-proxy
auth:
  mode: none
  # Canonical URL clients use (RFC 8707 resource, RFC 9728 metadata). Required unless mode=none.
  resourceUrl: ""
  entra:
    tenantId: ""
    clientId: ""
    appIdUri: ""          # default api://<clientId>
    cloud: public         # public | usgov | china
    tokenVersions: ["2"]  # add "1" only if you cannot switch the app to v2 tokens
  # Extra non-secret settings rendered into the auth.json ConfigMap (see docs/enterprise/configuration.md),
  # e.g. {"allowed_client_ids": [...], "scope_strategy": "granular", "protect_rest": true}
  config: {}
  preflight: warn         # warn | strict | off
  # Secret with keys: proxy-encryption-keys, entra-client-secret (entra-proxy only).
  existingSecret: ""
  # Only for quick trials; prefer existingSecret / external secret operators.
  secret:
    create: false
    proxyEncryptionKeys: ""
    entraClientSecret: ""

admin:
  enabled: false          # read-only console at /admin (MCP.Admin app role)

# uml-mcp.yaml sections (tools, rate_limit, logging, audit, metrics, rendering, server),
# rendered to a ConfigMap and loaded via UML_MCP_CONFIG. `env` above still wins.
# Auth stays under `auth:`. Reference: docs/configuration/uml-mcp-yaml.md
config: {}
#  tools:
#    disabled: [generate_uml_batch]
#  rate_limit:
#    enabled: true
#    key: principal
#    trusted_proxies: [10.0.0.0/8]
#    default: {requests_per_minute: 120, burst: 30}
#  logging: {level: INFO, format: json}
#  audit: {enabled: true, sinks: [stream, memory]}
#  metrics: {enabled: true, endpoint: true}

# AKS workload identity: federated credential instead of a client secret (entra-proxy)
workloadIdentity:
  enabled: false
  clientId: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

uvicorn:
  proxyHeaders: true
  forwardedAllowIps: "*"  # restrict to your ingress CIDR in production
  accessLog: false
  h11MaxIncompleteEventSize: 65536

env:
  KROKI_SERVER: https://kroki.io
  MCP_MEMORY_ONLY: "true"
  MCP_URL_ONLY: "false"
extraEnv: []

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}   # e.g. {kubernetes.io/metadata.name: ingress-nginx}

# Optional in-cluster renderers, all OFF by default: Kroki is https://kroki.io (env.KROKI_SERVER)
# and the PlantUML / mermaid.ink fallbacks are not used. Rendering order matches the app:
# Kroki first, then (when the fallback chain is on) the PlantUML server for PlantUML-family
# diagrams and mermaid.ink for Mermaid. Enabling one points uml-mcp at its Service; that wins
# over `env`, while `extraEnv` still wins over everything. Images are pinned to the same
# releases docker-compose.yml pulls.
kroki:
  enabled: false          # in-cluster Kroki; sets KROKI_SERVER and USE_LOCAL_KROKI
  image: {repository: yuzutech/kroki, tag: "0.33.0", pullPolicy: IfNotPresent}
  service: {port: 8000}
  resources: {}
  # Engines run as sidecars in the Kroki pod and are reached on localhost, like the
  # `mermaid` / `blockdiag` services in docker-compose.yml. (blockdiag is versioned
  # independently of Kroki; 0.21.3 is its latest release.)
  companions:
    mermaid:
      enabled: true
      image: {repository: yuzutech/kroki-mermaid, tag: "0.33.0", pullPolicy: IfNotPresent}
      resources: {}
    blockdiag:
      enabled: true
      image: {repository: yuzutech/kroki-blockdiag, tag: "0.21.3", pullPolicy: IfNotPresent}
      resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

plantuml:
  enabled: false          # in-cluster PlantUML server, the fallback for PlantUML-family diagrams
  externalUrl: ""         # use an existing server instead (ignored when enabled)
  image: {repository: plantuml/plantuml-server, tag: jetty-v1.2026.6, pullPolicy: IfNotPresent}
  service: {port: 8080}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

mermaidInk:
  enabled: false          # in-cluster mermaid.ink, the fallback for Mermaid diagrams
  externalUrl: ""         # use an existing server instead (ignored when enabled)
  image: {repository: ghcr.io/jihchi/mermaid.ink, tag: v16.0.0, pullPolicy: IfNotPresent}
  service: {port: 3000}
  # Headless Chromium needs syscalls the runtime's default seccomp profile blocks.
  # Unconfined is upstream's documented option; Pod Security "baseline" and "restricted"
  # reject it, so in such namespaces supply a Localhost profile here or leave mermaidInk off.
  securityContext:
    seccompProfile: {type: Unconfined}
  env: {}                 # see https://github.com/jihchi/mermaid.ink#environment-variables
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# MCP_DIAGRAM_FALLBACK. null = on when a PlantUML or mermaid.ink server is configured
# (in-cluster or externalUrl), otherwise left to the app's default. true/false forces it.
diagramFallback: null
