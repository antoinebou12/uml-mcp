[project]
name = "uml-mcp-plugin-deps"
version = "0.1.0"
description = "UML-MCP plugin: dependency graphs from package.json, package-lock.json, pyproject.toml, requirements.txt and uv.lock, as an interactive page or a static SVG tree."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["uml-mcp>=1.4.0"]

# Bundled with uml-mcp and on by default; as a separate package it loads when `deps`
# is listed in `plugins.enabled` of uml-mcp.yaml.
[project.entry-points."uml_mcp.renderers"]
deps = "uml_mcp_plugin_deps:DepsRenderer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel includes src/uml_mcp_plugin_deps/assets/page.js (the page script).
[tool.hatch.build.targets.wheel]
packages = ["src/uml_mcp_plugin_deps"]
