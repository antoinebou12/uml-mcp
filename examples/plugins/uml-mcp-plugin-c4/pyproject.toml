[project]
name = "uml-mcp-plugin-c4"
version = "0.1.0"
description = "UML-MCP plugin: one C4 model (context, containers, components) as a static C4 diagram or an interactive drill-down page."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["uml-mcp>=1.4.0"]

[project.entry-points."uml_mcp.renderers"]
c4 = "uml_mcp_plugin_c4:C4Renderer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uml_mcp_plugin_c4"]
