[project]
name = "uml-mcp-plugin-timeline"
version = "0.1.0"
description = "UML-MCP plugin: project timelines and roadmaps with swimlanes, phases, milestones, releases, dependencies and an interactive zoomable page."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["uml-mcp>=1.4.0"]

[project.entry-points."uml_mcp.renderers"]
timeline = "uml_mcp_plugin_timeline:TimelineRenderer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uml_mcp_plugin_timeline"]
