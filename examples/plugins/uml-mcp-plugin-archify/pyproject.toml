[project]
name = "uml-mcp-plugin-archify"
version = "0.1.0"
description = "UML-MCP plugin: archify-style architecture and workflow diagrams with colour-coded dashed groups, left-right or top-down flow, and light and dark themes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["uml-mcp>=1.4.0", "uml-mcp-plugin-stack-diagram>=0.1.0"]

[project.entry-points."uml_mcp.renderers"]
archify = "uml_mcp_plugin_archify:ArchifyRenderer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uml_mcp_plugin_archify"]
