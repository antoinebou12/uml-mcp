[project]
name = "uml-mcp-plugin-schema"
version = "0.1.0"
description = "UML-MCP plugin: database schema (ER) diagrams from SQL DDL or JSON, with crow's-foot relationships at the column rows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["uml-mcp>=1.4.0"]

[project.entry-points."uml_mcp.renderers"]
schema = "uml_mcp_plugin_schema:SchemaRenderer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uml_mcp_plugin_schema"]
