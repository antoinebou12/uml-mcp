[project]
name = "uml-mcp-plugin-statechart"
version = "0.1.0"
description = "UML-MCP plugin: statecharts from XState-like JSON, as a static SVG or an interactive simulator page."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["uml-mcp>=1.4.0"]

[project.entry-points."uml_mcp.renderers"]
statechart = "uml_mcp_plugin_statechart:StatechartRenderer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uml_mcp_plugin_statechart"]
