[project]
name = "uml-mcp-plugin-llm-visualizer"
version = "0.1.0"
description = "UML-MCP plugin for interactive 2D and 3D LLM architecture diagrams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["uml-mcp>=1.4.0"]

[project.entry-points."uml_mcp.renderers"]
llm-visualizer = "uml_mcp_plugin_llm_visualizer:LLMVisualizerRenderer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uml_mcp_plugin_llm_visualizer"]
